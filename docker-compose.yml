services:
  db:
    image: postgres:15-alpine
    container_name: pix_db
    environment:
      POSTGRES_USER: pix_user
      POSTGRES_PASSWORD: pix_password
      POSTGRES_DB: pix_db
    ports:
      - "5432:5432"
    volumes:
      - pix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix_user -d pix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: pix_backend
    environment:
      - DATABASE_URL=postgresql://pix_user:pix_password@db:5432/pix_db?schema=public
      - DIRECT_URL=postgresql://pix_user:pix_password@db:5432/pix_db?schema=public
      - JWT_SECRET=chave-secreta-projeto-pix-dev
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pix_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3333
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pix_postgres_data:
